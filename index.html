<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الوحدة 11 | الأمن السيبراني وإدارة الحوادث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #061018;
    --bg2: #0a1824;
    --panel: rgba(10, 22, 34, 0.92);
    --line: #1d3c52;
    --cyan: #5ce1ff;
    --cyan-dim: rgba(92, 225, 255, 0.14);
    --green: #3dffb0;
    --green-dim: rgba(61, 255, 176, 0.12);
    --red: #ff4d6d;
    --red-dim: rgba(255, 77, 109, 0.14);
    --amber: #ffc857;
    --text: #e8f3fb;
    --muted: #93a8ba;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(1200px 600px at 100% -10%, rgba(92, 225, 255, 0.08), transparent 50%),
                radial-gradient(900px 500px at -10% 110%, rgba(61, 255, 176, 0.06), transparent 45%),
                var(--bg);
    color: var(--text);
    line-height: 1.75;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: linear-gradient(rgba(92, 225, 255, 0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(92, 225, 255, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 30%, #000 20%, transparent 75%);
  }
  #matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.18;
    z-index: 0;
  }
  header, main { position: relative; z-index: 1; }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 14px;
    align-items: center;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(6, 16, 24, 0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand { display: flex; gap: 12px; align-items: center; }
  .pulse {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(61, 255, 176, 0.7);
    animation: ping 2.2s infinite;
  }
  @keyframes ping {
    70% { box-shadow: 0 0 0 12px rgba(61, 255, 176, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 255, 176, 0); }
  }
  .brand strong {
    display: block;
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.08em;
    font-size: 14px;
    color: var(--cyan);
  }
  .brand small { color: var(--muted); font-size: 13px; }
  .hdr-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, .choice { font-family: inherit; }
  .ghost, .primary, .lang {
    border: 1px solid var(--line);
    background: #0e2030;
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 700;
  }
  .lang { color: var(--cyan); border-color: #24596e; }
  .primary {
    background: linear-gradient(180deg, #14384a, #0e2433);
    border-color: #2a7f99;
    color: var(--cyan);
    padding: 12px 22px;
    font-size: 16px;
  }
  .primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .ghost:hover, .primary:hover, .lang:hover, .choice:hover { border-color: var(--cyan); }
  main { max-width: 980px; margin: 0 auto; padding: 28px 18px 70px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 26px;
    position: relative;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--cyan);
    opacity: 0.7;
  }
  .panel::before { top: 10px; inset-inline-start: 10px; border-inline-end: 0; border-bottom: 0; }
  .panel::after { bottom: 10px; inset-inline-end: 10px; border-inline-start: 0; border-top: 0; }
  .kicker {
    font-family: "Share Tech Mono", monospace;
    color: var(--amber);
    letter-spacing: 0.12em;
    font-size: 12px;
    margin: 0 0 8px;
  }
  h1 { font-size: clamp(28px, 4vw, 42px); line-height: 1.35; margin: 0 0 10px; }
  h2 { margin: 0 0 8px; font-size: 22px; }
  .lede { color: var(--muted); font-size: 17px; margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
  .card {
    border: 1px solid var(--line);
    background: rgba(8, 20, 32, 0.7);
    border-radius: 14px;
    padding: 14px;
    min-height: 120px;
  }
  .card b { display: block; color: var(--cyan); margin-bottom: 6px; }
  .card span { color: var(--muted); font-size: 14px; }
  label.field { display: block; margin: 8px 0 18px; font-weight: 700; }
  input[type="text"] {
    width: min(420px, 100%);
    margin-top: 8px;
    background: #07131d;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
  }
  input:focus, button:focus-visible, .choice:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meta {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    color: var(--muted); font-size: 14px; margin-bottom: 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #24596e; color: var(--cyan);
    border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700;
  }
  .bar { height: 8px; background: #102433; border-radius: 99px; overflow: hidden; margin: 8px 0 18px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); width: 0; }
  .scenario {
    background: #07131d;
    border-inline-start: 3px solid var(--amber);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .choices { display: grid; gap: 10px; }
  #liveScore, .count {
    direction: ltr;
    unicode-bidi: isolate;
    display: inline-block;
  }
  html[dir="rtl"] .choice { direction: rtl; }
  html[dir="ltr"] .choice { direction: ltr; }
  .choice {
    display: flex; gap: 12px; align-items: flex-start;
    text-align: start;
    width: 100%;
    background: #0b1b28;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    line-height: 1.7;
  }
  .choice .letter {
    flex: 0 0 auto;
    width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--cyan-dim); color: var(--cyan); font-weight: 800;
  }
  .choice.selected { border-color: var(--cyan); background: #102a3a; }
  .choice.good { border-color: var(--green); background: var(--green-dim); }
  .choice.bad { border-color: var(--red); background: var(--red-dim); }
  .choice:disabled { cursor: default; }
  .feedback { margin-top: 16px; border-radius: 14px; padding: 16px; border: 1px solid var(--line); }
  .feedback.good { border-color: #1f7a56; background: rgba(61, 255, 176, 0.06); }
  .feedback.bad { border-color: #8a3144; background: rgba(255, 77, 109, 0.06); }
  .feedback h3 { margin: 0 0 8px; }
  .feedback p { margin: 8px 0; }
  .stamp {
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.08em;
    font-size: 13px;
  }
  .report-top { display: grid; grid-template-columns: 180px 1fr; gap: 22px; align-items: center; }
  .ring {
    width: 160px; height: 160px; border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(var(--green) calc(var(--p) * 1%), #163044 0);
    margin-inline: auto;
  }
  .ring span {
    width: 124px; height: 124px; border-radius: 50%;
    background: #07131d; display: grid; place-items: center;
    font-size: 32px; font-weight: 800;
  }
  .lo-row { display: grid; grid-template-columns: 150px 1fr 52px; gap: 8px; align-items: center; margin: 8px 0; }
  .lo-track { height: 10px; background: #102433; border-radius: 99px; overflow: hidden; }
  .lo-track span { display: block; height: 100%; background: var(--cyan); }
  .miss { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 8px; }
  .miss article { padding: 10px 0; border-bottom: 1px solid rgba(29, 60, 82, 0.6); }
  .fx {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s linear;
    overflow: hidden;
  }
  .fx.on { opacity: 1; pointer-events: auto; }
  .fx.bad { background: rgba(40, 0, 10, 0.72); }
  .fx.good { background: rgba(0, 30, 20, 0.55); }
  .fx-card { text-align: center; padding: 20px; }
  .fx-card h2 {
    font-family: "Share Tech Mono", monospace;
    font-size: clamp(32px, 6vw, 64px);
    margin: 0;
    letter-spacing: 0.06em;
  }
  .fx.bad h2 { color: var(--red); animation: glitch 0.35s steps(2) 3; }
  .fx.good h2 { color: var(--green); }
  .stream {
    font-family: "Share Tech Mono", monospace;
    color: rgba(255, 77, 109, 0.75);
    font-size: 13px;
    line-height: 1.4;
    white-space: pre;
    margin-top: 10px;
  }
  .fx.good .stream { color: rgba(61, 255, 176, 0.8); }
  body.breach { animation: shake 0.45s linear; }
  @keyframes shake {
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  @keyframes glitch {
    0% { transform: translate(0); }
    40% { transform: translate(-4px, 1px); text-shadow: 3px 0 var(--cyan); }
    80% { transform: translate(4px, -1px); }
  }
  .hint { color: var(--muted); font-size: 14px; }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .report-top { grid-template-columns: 1fr; }
    .lo-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    header { padding: 12px; }
    .panel { padding: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    #matrix { display: none; }
  }
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div id="fx" class="fx" role="alert" aria-live="assertive"></div>
<header>
  <div class="brand">
    <span class="pulse" aria-hidden="true"></span>
    <div>
      <strong id="brandCode">UNIT 11 // INCIDENT LAB</strong>
      <small id="brandSub">الأمن السيبراني وإدارة الحوادث</small>
    </div>
  </div>
  <div class="hdr-actions">
    <span class="chip" id="liveScore">0 / 60</span>
    <button type="button" class="ghost" id="muteBtn">كتم الصوت</button>
    <button type="button" class="lang" id="langBtn">English</button>
  </div>
</header>
<main id="app"></main>
<script>
const QUESTIONS = [
  {
    "id": 1,
    "lo": "A",
    "code": {
      "ar": "أ.ف1",
      "en": "A.P1"
    },
    "scenario": {
      "ar": "في آخر يوم لموظف فُصل من عمله، حذف جداول الأسعار من خادم الشركة.",
      "en": "On the last day of a dismissed employee, the price spreadsheets were deleted from the company server."
    },
    "choices": [
      {
        "key": "in",
        "ar": "تهديد داخلي متعمد: موظف غير راضٍ يتلف البيانات انتقاماً.",
        "en": "A deliberate internal threat: a disgruntled employee destroys data as revenge."
      },
      {
        "key": "ex",
        "ar": "تهديد خارجي: الحساب بعد الفصل لم يعد حساب موظف، فالحذف يُحسب هجوماً من خارج المؤسسة.",
        "en": "An external threat: after dismissal the account is no longer a staff account, so the deletion counts as an attack from outside."
      },
      {
        "key": "nat",
        "ar": "إفصاح عرضي: الموظف ظن أن حذف الجداول جزء من تسليم العهدة، فالسبب ضعف التدريب.",
        "en": "Accidental disclosure: the employee thought deleting the spreadsheets was part of handing over, so the cause is weak training."
      }
    ],
    "correct": "in",
    "why": {
      "ar": "التهديد الداخلي يصدر من داخل المؤسسة. الكتاب يذكر الموظف المفصول الذي يحذف البيانات مثالاً على الانتقام.",
      "en": "An internal threat comes from inside the organisation. The textbook uses a dismissed employee who deletes data as the revenge example."
    },
    "impact": {
      "ar": "قد تتوقف عمليات تعتمد على هذه الجداول.",
      "en": "Work that depends on those spreadsheets may stop."
    },
    "miss": {
      "ar": "الفاعل ما زال من داخل المؤسسة وحذف الجداول عمداً في آخر يوم عمل. هذا ليس خطأ إرسال، وخروجه الوشيك لا يحوّله إلى مهاجم خارجي.",
      "en": "The actor was still inside the organisation and deleted the spreadsheets on purpose on the last day. This is not a mistaken send, and being about to leave does not make the person an outside attacker."
    }
  },
  {
    "id": 2,
    "lo": "A",
    "code": {
      "ar": "أ.ف1",
      "en": "A.P1"
    },
    "scenario": {
      "ar": "موظف نسخ كشوف الرواتب وباعها لشركة منافسة.",
      "en": "An employee copied the payroll files and sold them to a rival company."
    },
    "choices": [
      {
        "key": "un",
        "ar": "وصول داخلي غير مصرح به لتحقيق مكسب شخصي.",
        "en": "Unauthorised internal access for personal gain."
      },
      {
        "key": "ran",
        "ar": "تجسس تجاري من الخارج: الشركة المنافسة هي التي اخترقت النظام للحصول على الرواتب.",
        "en": "Commercial spying from outside: the rival company broke in to obtain the payroll."
      },
      {
        "key": "fw",
        "ar": "إفصاح عرضي: أُرسلت الكشوف إلى عنوان خاطئ لأن الموظف لم يُدرَّب على البريد.",
        "en": "Accidental disclosure: the files were sent to the wrong address because the employee was not trained on email."
      }
    ],
    "correct": "un",
    "why": {
      "ar": "الكتاب يعد الاطلاع على الرواتب ثم بيعها لمنافس وصولاً غير مصرح به من الداخل.",
      "en": "The textbook treats reading payroll and selling it to a rival as unauthorised access from inside."
    },
    "impact": {
      "ar": "تخسر الشركة سرية بيانات الموظفين وقد تخالف واجب حماية البيانات.",
      "en": "The company loses confidentiality of staff data and may breach its duty to protect personal data."
    },
    "miss": {
      "ar": "الموظف نفسه نسخ الكشوف وباعها، فهذا وصول داخلي لمكسب شخصي. ليس اختراقاً نفّذه المنافس، ولا إرسالاً بالخطأ.",
      "en": "The employee copied the payroll and sold it, which is internal access for personal gain. The rival did not break in, and this was not a mis-sent email."
    }
  },
  {
    "id": 3,
    "lo": "A",
    "code": {
      "ar": "أ.ف1",
      "en": "A.P1"
    },
    "scenario": {
      "ar": "موظف لم يُدرَّب جيداً أرسل سعر التكلفة، لا سعر البيع، بالبريد إلى عميل.",
      "en": "A poorly trained employee emailed the cost price, not the sale price, to a customer."
    },
    "choices": [
      {
        "key": "acc",
        "ar": "إفصاح عرضي ناتج عن ضعف التدريب.",
        "en": "Accidental disclosure caused by weak training."
      },
      {
        "key": "ph",
        "ar": "تهديد داخلي متعمد: إرسال سعر التكلفة يعني أن الموظف قصد إضرار الشركة.",
        "en": "A deliberate internal threat: sending the cost price means the employee meant to harm the company."
      },
      {
        "key": "dos",
        "ar": "فشل تشفير البريد: السر خرج لأن الرسالة لم تُشفَّر، والتدريب لا يمنع ذلك.",
        "en": "An email-encryption failure: the secret left because the message was not encrypted, and training would not stop that."
      }
    ],
    "correct": "acc",
    "why": {
      "ar": "الكتاب يضرب سعر التكلفة السري مثالاً على موظف غير مدرَّب يفصح عن السر بالخطأ.",
      "en": "The textbook uses a secret cost price as the example of an untrained employee disclosing a secret by mistake."
    },
    "impact": {
      "ar": "المنافس أو العميل يحصل على معلومة تسعير لا ينبغي أن تخرج.",
      "en": "A rival or a customer gains pricing information that should not leave the firm."
    },
    "miss": {
      "ar": "الحالة خطأ من موظف غير مدرَّب، لا نية انتقام. تشفير الرسالة لا يمنع صاحباً مخوَّلاً من إرسال السر بنفسه إلى العميل.",
      "en": "This is a mistake by an untrained employee, not an intent to harm. Encrypting the message does not stop an authorised person from sending the secret to the customer."
    }
  },
  {
    "id": 4,
    "lo": "A",
    "code": {
      "ar": "أ.ف1",
      "en": "A.P1"
    },
    "scenario": {
      "ar": "زائر تُرك وحده في الاستقبال، وشاشة الحجز تعرض بيانات مرضى في مكان عام.",
      "en": "A visitor was left alone at reception, and the booking screen showed patient data in a public area."
    },
    "choices": [
      {
        "key": "vis",
        "ar": "تهديد زائر مع ضعف في مرافقة الزوار وترتيب الشاشات.",
        "en": "A visitor threat, plus weak escort practice and poor screen placement."
      },
      {
        "key": "sql",
        "ar": "النظرة لا تكفي: الحادث يبدأ فقط إذا صوّر الزائر الشاشة أو نسخ منها.",
        "en": "A glance is not enough: the incident starts only if the visitor photographs the screen or copies from it."
      },
      {
        "key": "wep",
        "ar": "تشفير قاعدة الحجز يكفي، لأن البيانات المشفّرة لا تُقرأ من شاشة مفتوحة أمام الزائر.",
        "en": "Encrypting the booking database is enough, because encrypted data cannot be read from a screen left open in front of a visitor."
      }
    ],
    "correct": "vis",
    "why": {
      "ar": "الكتاب يطلب التحقق من سبب وجود الزائر وعدم تركه وحده، وترتيب الشاشات حتى لا يراها غير المعني.",
      "en": "The textbook requires a genuine reason for a visitor, no visitor left alone, and screens placed so only the people concerned can see them."
    },
    "impact": {
      "ar": "قد يتسرب سر طبي أو تجاري من مجرد نظرة، بلا اختراق تقني.",
      "en": "A medical or commercial secret can leak from a glance, with no technical intrusion."
    },
    "miss": {
      "ar": "الكتاب يعد ترك الزائر وحده والشاشة الظاهرة تهديداً بمجرد النظرة، بلا حاجة إلى تصوير. تشفير القرص لا يخفي بيانات معروضة أصلاً على الشاشة.",
      "en": "The textbook treats a visitor left alone with a visible screen as a threat from the glance itself, with no need for a photograph. Disk encryption does not hide data already shown on the screen."
    }
  },
  {
    "id": 5,
    "lo": "A",
    "code": {
      "ar": "أ.ف1",
      "en": "A.P1"
    },
    "scenario": {
      "ar": "مرفق بريد شفّر ملفات الجهاز وطلب الدفع بعملة بيتكوين مقابل مفتاح فك التشفير.",
      "en": "An email attachment encrypted the computer’s files and demanded Bitcoin for a decryption key."
    },
    "choices": [
      {
        "key": "rw",
        "ar": "برنامج فدية: تشفير ثم طلب مقابل المفتاح.",
        "en": "Ransomware: encryption, then a demand for the key."
      },
      {
        "key": "ad",
        "ar": "حصان طروادة: المرفق بدا ملفاً عادياً وأخفى البرنامج، وطلب البيتكوين مجرد وسيلة دفع.",
        "en": "A Trojan: the attachment looked like an ordinary file and hid the program. The Bitcoin demand is only a way to pay."
      },
      {
        "key": "sp",
        "ar": "فيروس متنقل: قفل الملفات يعني أنه نسخ نفسه عبر الجهاز ثم طلب أجراً على الإزالة.",
        "en": "A worm: locking the files means it copied itself across the computer, then charged a fee to remove itself."
      }
    ],

const state = {
  lang: "ar",
  screen: "intro",
  name: "",
  index: 0,

  sheetNote: ""

let audioCtx = null;
let fxTimer = 0;

function t() { return UI[state.lang]; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function letters() {
  return state.lang === "ar" ? ["أ", "ب", "ج"] : ["A", "B", "C"];
}

function correctCount() {
  return state.answers.reduce((n, key, i) => n + (key === QUESTIONS[i].correct ? 1 : 0), 0);
}

function tone(ok) {
  if (state.mute) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.0001, now);
    if (ok) {
      osc.type = "sine";
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.09);
      osc.frequency.setValueAtTime(783.99, now + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.05, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      osc.start(now);
      osc.stop(now + 0.44);
    } else {
      osc.disconnect();
      gain.disconnect();
      const ding = (freq, t0, dur) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(freq, t0);
        o.connect(g);
        g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.04, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.start(t0);
        o.stop(t0 + dur + 0.02);
      };
      ding(311.13, now, 0.16);
      ding(246.94, now + 0.15, 0.24);
    }
  } catch (err) {
    /* audio is optional */
  }
}

function showFx(ok) {
  const fx = document.getElementById("fx");
  const u = t();
  const lines = ok
    ? "TLS OK\nAUTH PASS\nHASH MATCH\nCHANNEL LOCKED"
    : "DROP PACKET\nRULE DENY\nAUTH FAIL\nLOG ALERT";
  fx.className = "fx on " + (ok ? "good" : "bad");
  fx.innerHTML = `<div class="fx-card"><p class="kicker">${ok ? "SECURE STATE" : "INCIDENT ALERT"}</p><h2>${esc(ok ? u.secure : u.breach)}</h2><p class="stamp">${esc(ok ? u.verified : u.denied)}</p><div class="stream">${lines}</div></div>`;
  document.body.classList.toggle("breach", !ok);
  clearTimeout(fxTimer);
  const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  fxTimer = setTimeout(() => {
    fx.className = "fx";
    fx.innerHTML = "";
    document.body.classList.remove("breach");
  }, motion ? 700 : (ok ? 1300 : 1650));
}

function choiceByKey(q, key) {
  return q.choices.find((c) => c.key === key);
}

function render() {
  const u = t();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.title = state.lang === "ar"
    ? "اختبار الوحدة 11 | الأمن السيبراني وإدارة الحوادث"
    : "Unit 11 exam | Cybersecurity and incident management";
  document.getElementById("brandSub").textContent = u.sub;
  document.getElementById("langBtn").textContent = u.lang;
  document.getElementById("muteBtn").textContent = state.mute ? u.unmute : u.mute;
  const shown = state.screen === "intro" ? 0 : correctCount();
  document.getElementById("liveScore").textContent = u.live(shown, QUESTIONS.length);
  const app = document.getElementById("app");
  if (state.screen === "intro") app.innerHTML = introHtml();
  else if (state.screen === "report") app.innerHTML = reportHtml();
  else app.innerHTML = examHtml();
  if (state.screen === "report" && state.sheetNote) {
    const box = document.getElementById("sheetStatus");
    if (box) box.textContent = state.sheetNote;
  }
}

function examHtml() {
  const u = t();
  const q = QUESTIONS[state.index];
  const review = state.screen === "review";
  const order = state.shuffle[state.index];
  const pct = Math.round((state.index / QUESTIONS.length) * 100);
  const opts = order.map((key, i) => {
    const c = choiceByKey(q, key);
    let cls = "choice";
    if (state.picked === key) cls += " selected";
    if (state.locked && key === q.correct) cls += " good";
    if (state.locked && state.picked === key && key !== q.correct) cls += " bad";
    return `<button type="button" class="${cls}" data-action="pick" data-key="${esc(key)}" ${state.locked ? "disabled" : ""}>
      <span class="letter">${letters()[i]}</span><span>${esc(c[state.lang])}</span>
    </button>`;
  }).join("");
  let feedback = "";
  if (state.locked) {
    const ok = state.picked === q.correct;
    feedback = `<div class="feedback ${ok ? "good" : "bad"}">
      <p class="stamp">${esc(ok ? u.correctStamp : u.wrongStamp)}</p>
      <h3>${esc(u.why)}</h3><p>${esc(q.why[state.lang])}</p>
      <h3>${esc(u.impact)}</h3><p>${esc(q.impact[state.lang])}</p>
      <h3>${esc(u.miss)}</h3><p>${esc(q.miss[state.lang])}</p>
    </div>`;
  }
  const last = state.index === QUESTIONS.length - 1;
  let action = "";
  if (!state.locked) {
    action = `<button type="button" class="primary" data-action="confirm" ${state.picked ? "" : "disabled"}>${esc(u.confirm)}</button>`;
  } else if (review && last) {
    action = `<button type="button" class="primary" data-action="report">${esc(u.backReport)}</button>`;
  } else if (last) {
    action = `<button type="button" class="primary" data-action="report">${esc(u.finish)}</button>`;
  } else {
    action = `<button type="button" class="primary" data-action="next">${esc(review ? u.reviewNext : u.next)}</button>`;
  }
  return `<section class="panel">
    <div class="meta">
      <span class="chip">${esc(q.code[state.lang])}</span>
      <span>${esc(u.case)} <span class="count">${String(state.index + 1).padStart(2, "0")} / ${QUESTIONS.length}</span></span>
    </div>
    <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
    <div class="scenario"><strong>${esc(u.lo[q.lo])}</strong><p>${esc(q.scenario[state.lang])}</p></div>
    <div class="choices">${opts}</div>
    ${feedback}
    <div class="row" style="margin-top:16px">${action}</div>
  </section>`;
}

function bandFor(pct) {
  return t().bands.find((b) => pct >= b[0]);
}

function reportHtml() {
  const u = t();
  const total = QUESTIONS.length;
  const score = correctCount();
  const pct = Math.round((score / total) * 100);
  const band = bandFor(pct);
  const groups = { A: [0, 0], B: [0, 0], C: [0, 0], D: [0, 0] };
  QUESTIONS.forEach((q, i) => {
    groups[q.lo][1] += 1;
    if (state.answers[i] === q.correct) groups[q.lo][0] += 1;
  });
  let weak = "A";
  let weakRatio = 2;
  Object.keys(groups).forEach((k) => {
    const ratio = groups[k][0] / groups[k][1];
    if (ratio < weakRatio) { weakRatio = ratio; weak = k; }
  });
  const rows = Object.keys(groups).map((k) => {
    const [ok, n] = groups[k];
    const w = Math.round((ok / n) * 100);
    return `<div class="lo-row"><span>${esc(u.lo[k])}</span><div class="lo-track"><span style="width:${w}%"></span></div><b class="count">${ok}/${n}</b></div>`;
  }).join("");
  const misses = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q, i }) => state.answers[i] !== q.correct);
  const missHtml = misses.length
    ? misses.map(({ q, i }) => `<article><b>${esc(q.code[state.lang])}</b><p>${esc(q.scenario[state.lang])}</p><p>${esc(q.why[state.lang])}</p></article>`).join("")
    : `<p>${esc(u.noneMiss)}</p>`;
  const who = state.name.trim() || (state.lang === "ar" ? "الطالب" : "Student");
  return `<section class="panel">
    <p class="kicker">${esc(u.reportKicker)}</p>
    <div class="report-top">
      <div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
      <div>
        <h1>${esc(band[1])}</h1>
        <p class="lede">${esc(who)} · ${esc(u.scoreLine(score, total))}</p>
        <p>${esc(band[2])}</p>
        <p><strong>${esc(u.weakest)}:</strong> ${esc(u.lo[weak])}</p>
      </div>
    </div>
    ${rows}
    <div class="miss"><h2>${esc(u.missed)}</h2>${missHtml}</div>
    <div class="row" style="margin-top:16px">
      <button type="button" class="primary" data-action="review">${esc(u.review)}</button>
      <button type="button" class="ghost" data-action="restart">${esc(u.again)}</button>
    </div>
    <p class="hint" id="sheetStatus"></p>
    <p class="hint">${esc(u.disclaimer)}</p>
  </section>`;
}

const SHEET_URL = "https://script.google.com/macros/s/AKfycbxu5XsIVoLxmbXUsOczsG5WJiFzqtqsmuQdr8BjKuP1-QjIXuf-OIr1J61SwSzSPrM/exec";

function submitResult() {
  const box = document.getElementById("sheetStatus");
  const note = function (text) {
    state.sheetNote = text;
    const live = document.getElementById("sheetStatus");
    if (live) live.textContent = text;
  };
  if (state.sent) {
    note(state.sheetNote || "");
    return;
  }
  if (!SHEET_URL) {
    note(state.lang === "ar"
      ? "العلامة محفوظة على هذا الجهاز. ربط سجل المعلم يحتاج نشر سكربت النتائج مرة واحدة."
      : "The mark stays on this device. The teacher log needs the results script published once.");
    return;
  }
  const total = QUESTIONS.length;
  const score = correctCount();
  const pct = Math.round((score / total) * 100);
  const band = bandFor(pct);
  const groups = { A: [0, 0], B: [0, 0], C: [0, 0], D: [0, 0] };
  QUESTIONS.forEach((q, i) => {
    groups[q.lo][1] += 1;
    if (state.answers[i] === q.correct) groups[q.lo][0] += 1;
  });
  note(state.lang === "ar" ? "جاري إرسال العلامة إلى سجل المعلم…" : "Sending the mark to the teacher log…");
  state.sending = true;
  fetch(SHEET_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      name: state.name.trim(),
      correct: score,
      total: total,
      percent: pct,
      band: band[1],
      outcomeA: groups.A[0] + "/" + groups.A[1],
      outcomeB: groups.B[0] + "/" + groups.B[1],
      outcomeC: groups.C[0] + "/" + groups.C[1],
      outcomeD: groups.D[0] + "/" + groups.D[1],
      items: QUESTIONS.map((q, i) => {
        const chosen = q.choices.find((c) => c.key === state.answers[i]);
        return {
          n: i + 1,
          code: q.code,
          lo: q.lo,
          ok: state.answers[i] === q.correct ? 1 : 0,
          pick: chosen ? chosen.ar : ""
        };
      })
    })
  }).then(() => {
    state.sent = true;
    state.sending = false;
    note(state.lang === "ar" ? "أُرسلت العلامة إلى سجل المعلم." : "The mark was sent to the teacher log.");
  }).catch(() => {
    state.sending = false;
    note(state.lang === "ar" ? "لم تصل العلامة. تحقق من الاتصال ثم أعد فتح التقرير." : "The mark did not arrive. Check the connection, then open the report again.");
  });
}

function startExam() {
  const input = document.getElementById("nameInput");
  state.name = input ? input.value : state.name;
  state.answers = QUESTIONS.map(() => null);
  state.shuffle = QUESTIONS.map((q) => shuffle(q.choices.map((c) => c.key)));
  state.index = 0;
  state.picked = null;
  state.locked = false;
  state.screen = "exam";
  state.startedAt = Date.now();
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (err) { /* ignore */ }
  render();
}

function onAppClick(event) {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "start") startExam();
  if (action === "pick" && !state.locked) {
    state.picked = el.dataset.key;
    render();
  }
  if (action === "confirm" && state.picked && !state.locked) {
    state.locked = true;
    state.answers[state.index] = state.picked;
    const ok = state.picked === QUESTIONS[state.index].correct;
    tone(ok);
    showFx(ok);
    render();
  }
  if (action === "next") {
    state.index += 1;
    state.picked = state.screen === "review" ? state.answers[state.index] : null;
    state.locked = state.screen === "review";
    render();
  }
  if (action === "report") {
    state.screen = "report";
    render();
    submitResult();
  }
  if (action === "review") {
    state.screen = "review";
    state.index = 0;
    state.picked = state.answers[0];
    state.locked = true;
    render();
  }
  if (action === "restart") {
    state.screen = "intro";
    state.index = 0;
    state.picked = null;
    state.locked = false;
    state.sent = false;
    state.sending = false;
    state.sheetNote = "";
    state.answers = [];
    render();
  }
}

function boot() {
  QUESTIONS.forEach((q) => {
    if (q.choices.length !== 3 || !q.choices.some((c) => c.key === q.correct)) {
      throw new Error("Bad question " + q.id);
    }
  });
  document.getElementById("app").addEventListener("click", onAppClick);
  document.getElementById("app").addEventListener("input", (event) => {
    if (event.target.id === "nameInput") state.name = event.target.value;
  });
  document.getElementById("langBtn").addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar";
    render();
  });
  document.getElementById("muteBtn").addEventListener("click", () => {
    state.mute = !state.mute;
    render();
  });
  document.addEventListener("keydown", (event) => {
    if (state.screen !== "exam" || state.locked) return;
    const map = { "1": 0, "2": 1, "3": 2, a: 0, b: 1, c: 2 };
    const idx = map[event.key.toLowerCase()];
    if (idx === undefined) return;
    state.picked = state.shuffle[state.index][idx];
    render();
  });
  render();
  const canvas = document.getElementById("matrix");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = canvas.getContext("2d");
  const glyphs = "01الأمنNET$#<>";
  let cols = 0;
  let drops = [];
  function size() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = Array.from({ length: cols }, () => Math.random() * -40);
  }
  size();
  window.addEventListener("resize", size);
  function draw() {
    ctx.fillStyle = "rgba(6, 16, 24, 0.18)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#1f6f78";
    ctx.font = "14px Share Tech Mono, monospace";
    drops.forEach((y, i) => {
      const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      else drops[i] = y + 1;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

if (typeof document !== "undefined") boot();
</script>
